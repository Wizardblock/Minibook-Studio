name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install Pillow reportlab requests platformdirs pdfplumber pyyaml
      - run: python -m unittest discover -s tests -t .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-latest, name: macos}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the version
        shell: bash
        run: echo "VERSION=$(python -c "from minibook.about import VERSION; print(VERSION)")" >> "$GITHUB_ENV"
      - name: Install the app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/minibook.spec
      - name: Make the output folder
        shell: bash
        run: mkdir -p release

      # ---------- Windows: an installer and a portable zip ----------
      - name: Self-test the build (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          dist/MiniBookStudio/MiniBookStudio.exe --selftest --log selftest.log || { cat selftest.log; exit 1; }
          cat selftest.log
      - name: Portable zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          python packaging/stage.py --os windows --dist dist --out release --version $env:VERSION
          Compress-Archive -Path "release/MiniBook-Studio-windows-portable-$env:VERSION" -DestinationPath "release/MiniBook-Studio-windows-portable-$env:VERSION.zip"
      - name: Installer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install and self-test the installer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $setup = "release/MiniBook-Studio-Setup-$env:VERSION.exe"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$PWD\installed" -Wait
          Get-ChildItem "$PWD\installed" | Select-Object -First 20 | Out-Host
          $p = Start-Process -FilePath "$PWD\installed\MiniBookStudio.exe" -ArgumentList "--selftest","--log","$PWD\installed-selftest.log" -Wait -PassThru
          if (Test-Path installed-selftest.log) { Get-Content installed-selftest.log }
          if ($p.ExitCode -ne 0) { exit 1 }

      # ---------- Mac: a disk image ----------
      - name: Self-test the build (Mac)
        if: matrix.name == 'macos'
        run: '"dist/MiniBook Studio.app/Contents/MacOS/MiniBookStudio" --selftest'
      - name: Disk image (Mac)
        if: matrix.name == 'macos'
        run: |
          python packaging/stage.py --os macos --dist dist --out release --version "$VERSION"
          hdiutil create -volname "MiniBook Studio" -srcfolder "release/MiniBook-Studio-macos-$VERSION" -ov -format UDZO "release/MiniBook-Studio-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: MiniBook-Studio-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the version
        run: echo "VERSION=$(python -c "from minibook.about import VERSION; print(VERSION)")" >> "$GITHUB_ENV"
      - name: Install the X helper libraries the bundle must carry
        run: |
          # Qt needs these to open a window; most desktops lack libxcb-cursor0, so they travel inside the download
          sudo apt-get update
          sudo apt-get install -y appstream libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 libxkbcommon-x11-0
      - name: Install the app, PyInstaller and the Qt window backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller "pywebview[qt]"
      - name: Build
        run: pyinstaller --noconfirm packaging/minibook.spec
      - name: Check what the bundle carries of the system's own libraries
        run: |
          # these must come from the user's system, never from this download
          if find dist/MiniBookStudio -name 'libglib-2.0*' -o -name 'libgio-2.0*' -o -name 'libstdc++*' -o -name 'libGLX*' -o -name 'libEGL*' | grep .; then
            echo "the bundle carries system libraries that clash on other distributions"; exit 1
          fi
      - name: Check the X helper libraries are inside the bundle
        run: |
          find dist/MiniBookStudio -name 'libxcb-cursor*' | grep .
          find dist/MiniBookStudio -name 'libxkbcommon-x11*' | grep .
      - name: AppImage (any Linux)
        run: ./packaging/make_appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: MiniBook-Studio-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  generic-test:
    needs: appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:latest", "archlinux:latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: MiniBook-Studio-linux-appimage
          path: pkg
      - name: Start it in a plain ${{ matrix.image }}
        run: |
          chmod +x pkg/*.AppImage
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/packaging/linux:/t:ro" ${{ matrix.image }} \
            sh -c 'cp /pkg/*.AppImage /tmp/app.AppImage && /t/test-generic.sh /tmp/app.AppImage'

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the version
        run: echo "VERSION=$(python -c "from minibook.about import VERSION; print(VERSION)")" >> "$GITHUB_ENV"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Check the Linux metadata
        run: |
          desktop-file-validate packaging/linux/io.github.wizardblock.minibookstudio.desktop
          appstreamcli validate --no-net packaging/linux/io.github.wizardblock.minibookstudio.metainfo.xml
      - name: Installer package (Linux .deb)
        run: ./packaging/make_deb.sh "$VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: MiniBook-Studio-linux-deb
          path: dist/*.deb
          if-no-files-found: error

  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MiniBook-Studio-linux-deb
          path: pkg
      - name: Install the .deb the way a user does
        run: |
          # the runner's own tool Python is on PATH; a user's desktop uses the system Python
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          sudo apt-get update
          sudo apt-get install -y ./pkg/*.deb
          python3 --version
      - name: Test the installed app
        run: |
          minibook-studio --version
          minibook-studio --selftest || exit 1
          minibook-studio --selftest-window --log "$RUNNER_TEMP/window.log" || {
            echo "--- window log"; cat "$RUNNER_TEMP/window.log" 2>/dev/null
            exit 1
          }
      - name: Open the installed app on a real screen
        run: |
          sudo apt-get install -y xvfb xdotool x11-utils
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 3
          minibook-studio &
          for i in $(seq 1 60); do
            if xdotool search --name "MiniBook Studio" | grep -q .; then echo "window appeared after $i s"; found=1; break; fi
            sleep 1
          done
          echo "--- windows on screen"; xwininfo -root -tree | head -30 || true
          echo "--- app log"; cat ~/.cache/MiniBookStudio/minibook.log 2>/dev/null || true
          pkill -f minibook_gui || true
          [ "${found:-}" = 1 ] || { echo "No MiniBook Studio window ever appeared"; exit 1; }
          if grep -vi vulkan ~/.cache/MiniBookStudio/minibook.log | grep -qE "undefined symbol|neither GLX nor EGL|Failed to create (RHI|QRhi|context)|no QRhi|cannot open shared object"; then
            echo "the app log shows the window could not draw"; exit 1
          fi
      - name: Remove it again
        run: sudo apt-get remove -y minibook-studio && test ! -e /opt/minibook-studio/venv

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-test, generic-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{version}/$VERSION/g" packaging/release-notes.md > notes.md
          cd downloads
          sha256sum * > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "MiniBook Studio ${{ github.ref_name }}" --notes-file ../notes.md --generate-notes *
