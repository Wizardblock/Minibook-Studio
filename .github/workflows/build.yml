name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow reportlab requests platformdirs pdfplumber pyyaml
      - run: python -m unittest discover -s tests -t .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-latest, name: macos}
          - {os: ubuntu-22.04, name: linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install the Linux window backend
        if: matrix.name == 'linux'
        run: pip install "pywebview[qt]"
      - name: Build
        run: pyinstaller --noconfirm packaging/minibook.spec
      - name: Wrap as an AppImage
        if: matrix.name == 'linux'
        run: ./packaging/make_appimage.sh
      - name: Self-test the build (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          dist/MiniBookStudio/MiniBookStudio.exe --selftest --log selftest.log || { cat selftest.log; exit 1; }
          cat selftest.log
      - name: Self-test the build (Mac)
        if: matrix.name == 'macos'
        run: '"dist/MiniBook Studio.app/Contents/MacOS/MiniBookStudio" --selftest'
      - name: Self-test the build (Linux)
        if: matrix.name == 'linux'
        run: dist/MiniBook-Studio-x86_64.AppImage --appimage-extract-and-run --selftest
      - name: Collect the download
        shell: bash
        run: |
          VERSION=$(python -c "from minibook.about import VERSION; print(VERSION)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python packaging/stage.py --os ${{ matrix.name }} --dist dist --out release --version "$VERSION"
      - name: Zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "release/MiniBook-Studio-windows-$env:VERSION" -DestinationPath "release/MiniBook-Studio-windows-$env:VERSION.zip"
      - name: Zip (Mac)
        if: matrix.name == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "release/MiniBook-Studio-macos-$VERSION" "release/MiniBook-Studio-macos-$VERSION.zip"
      - name: Pack (Linux)
        if: matrix.name == 'linux'
        run: tar -czf "release/MiniBook-Studio-linux-$VERSION.tar.gz" -C release "MiniBook-Studio-linux-$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MiniBook-Studio-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd downloads
          sha256sum * > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "MiniBook Studio ${{ github.ref_name }}" --generate-notes *
